{% load portal_tags %}{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination-wrap" aria-label="Pagination"><span class="text-muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="btn btn-light btn-sm" href="{% page_url page_obj.previous_page_number %}">← Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-primary btn-sm" href="{% page_url page_obj.next_page_number %}">Next →</a>{% endif %}</div></nav>{% endif %}
