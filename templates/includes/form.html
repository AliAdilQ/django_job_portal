{% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="form-field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-label="required"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error" role="alert">{{ error }}</div>{% endfor %}
</div>
{% endfor %}
