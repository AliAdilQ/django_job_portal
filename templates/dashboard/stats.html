<div class="stats-grid{% if stats|length == 7 %} admin-stats{% endif %}">{% for label,value,icon in stats %}<div class="stat-card"><div class="stat-heading"><span>{{ label }}</span><span class="stat-icon">{% include 'includes/icon.html' with name=icon %}</span></div><strong>{{ value }}</strong><small>{% if user.is_staff %}Platform total{% else %}In your workspace{% endif %}</small></div>{% endfor %}</div>
